<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>✈️ Travel Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root{--bg:#f2f2f7;--card:#fff;--accent:#007AFF;--mall:#2E7D32;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#app{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg)}
#app{display:flex;flex-direction:column}

/* Header */
header{background:#0d0f14;color:#fff;flex-shrink:0;
  padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top,10px));
  display:flex;align-items:center;gap:10px}
header h1{font-size:15px;font-weight:800;flex:1}
#note-select{background:rgba(255,255,255,.12);color:#fff;border:none;
  border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;
  font-family:-apple-system,sans-serif;cursor:pointer;max-width:160px}
#note-select option{color:#000;background:#fff}

/* Map */
#map{flex:0 0 46vh;min-height:150px}

/* Panel */
#panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}

/* Cat filter */
#cat-bar{display:flex;gap:6px;padding:8px 14px 4px;overflow-x:auto;
  flex-shrink:0;scrollbar-width:none}
#cat-bar::-webkit-scrollbar{display:none}
.cat-tab{padding:5px 13px;border-radius:20px;border:none;font-size:11px;
  font-weight:700;cursor:pointer;white-space:nowrap;
  background:#e5e5ea;color:#666;flex-shrink:0}
.cat-tab.on{color:#fff}

/* List */
#list{flex:1;overflow-y:auto;padding:6px 14px 80px}

/* Street section */
.st-section{margin-bottom:4px}
.st-hdr{display:flex;align-items:center;gap:8px;padding:10px 2px 5px;flex-wrap:nowrap}
.st-pill{padding:3px 11px;border-radius:20px;color:#fff;
  font-size:11px;font-weight:800;white-space:nowrap;flex-shrink:0}
.st-en{font-size:11px;color:#aaa;font-weight:500;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.st-all{background:none;border:1.5px solid #d0d0d0;border-radius:8px;
  padding:3px 10px;font-size:11px;font-weight:700;color:#555;cursor:pointer;flex-shrink:0;white-space:nowrap}

/* Place card */
.pcard{background:var(--card);border-radius:11px;margin-bottom:6px;
  display:flex;align-items:center;gap:9px;padding:10px 11px;
  cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.pcard.mitem{margin:0;border-radius:0;border-top:1px solid #f2f2f2;
  box-shadow:none;padding-left:16px}
.pcheck{width:21px;height:21px;border-radius:6px;border:2px solid #d0d0d0;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:12px;transition:all .15s}
.pcard.checked .pcheck{border-color:var(--c,#007AFF);background:var(--c,#007AFF);color:#fff}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pname{font-size:13px;font-weight:700;color:#111;line-height:1.2}
.pname-en{font-size:11px;color:#aaa;font-weight:400}
.pdesc{font-size:11px;color:#999;margin-top:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pbadge{font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;
  color:#fff;text-transform:uppercase;flex-shrink:0}

/* Mall group */
.mall-group{background:var(--card);border-radius:11px;margin-bottom:6px;
  overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.mall-ghdr{display:flex;align-items:center;gap:9px;padding:10px 11px;
  cursor:pointer;background:#f0f7f0}
.mall-gicon{width:26px;height:26px;border-radius:7px;background:var(--mall);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.mall-gname{font-size:12px;font-weight:800;color:var(--mall);flex:1;min-width:0;line-height:1.2}
.mall-gct{font-size:10px;color:#aaa;margin-top:1px}
.mall-sel{background:none;border:1.5px solid #4CAF50;border-radius:7px;
  padding:3px 9px;font-size:11px;font-weight:700;color:var(--mall);
  cursor:pointer;flex-shrink:0}
.mall-chev{font-size:11px;color:#aaa;transition:transform .2s;flex-shrink:0}
.mall-group.open .mall-chev{transform:rotate(180deg)}
.mall-items{display:none}
.mall-group.open .mall-items{display:block}

/* Bottom plot bar */
#plot-bar{position:absolute;bottom:0;left:0;right:0;
  padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom,10px));
  background:rgba(242,242,247,.96);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-top:1px solid #ddd;
  display:flex;gap:8px;z-index:100}
#plot-btn{flex:1;background:var(--accent);color:#fff;border:none;
  padding:13px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
#plot-btn:disabled{background:#c7c7cc;cursor:default}
#clear-btn{background:#e5e5ea;color:#333;border:none;
  padding:13px 14px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer}

/* Empty */
#empty{text-align:center;padding:36px 20px}
#empty .ei{font-size:42px;margin-bottom:10px}
#empty h3{font-size:15px;font-weight:700;margin-bottom:6px}
#empty p{font-size:13px;color:#999;line-height:1.5}

/* Popup */
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:0;overflow:hidden;border:none}
.leaflet-popup-content{margin:0!important}
.leaflet-popup-tip-container{display:none}
.leaflet-popup-close-button{top:6px!important;right:10px!important;font-size:18px!important;color:rgba(255,255,255,.9)!important;z-index:5}
.pu-top{height:5px}
.pu-body{padding:11px 13px 10px}
.pu-cat{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.pu-name{font-size:14px;font-weight:800;color:#111;margin-bottom:2px;line-height:1.2}
.pu-sub{font-size:11px;color:#aaa;margin-bottom:5px}
.pu-desc{font-size:11px;color:#555;line-height:1.4;margin-bottom:8px}
.pu-maps{display:block;text-align:center;padding:8px;border-radius:8px;font-size:12px;font-weight:700;color:#fff;text-decoration:none}
.mall-pu-row{padding:5px 0;border-top:1px solid #f0f0f0;font-size:11px}
.mall-pu-row:first-child{border-top:none}
.mall-pu-row strong{display:block;font-weight:700}
.mall-pu-row span{color:#999}

/* Geocode overlay */
#geo-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:2000;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#geo-overlay.show{display:flex}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#geo-msg{color:#fff;font-size:14px;font-weight:600}

/* Toast */
#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);
  background:#222;color:#fff;padding:9px 16px;border-radius:20px;
  font-size:13px;font-weight:600;z-index:3000;opacity:0;
  transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>✈️ Travel Planner</h1>
    <select id="note-select" onchange="switchNote(this.value)">
      <option>Loading…</option>
    </select>
  </header>
  <div id="map"></div>
  <div id="panel" style="position:relative">
    <div id="cat-bar">
      <button class="cat-tab on" data-cat="all" style="background:#555" onclick="filterCat('all',this)">All</button>
      <button class="cat-tab" data-cat="food"       onclick="filterCat('food',this)">🍜 Food</button>
      <button class="cat-tab" data-cat="shopping"   onclick="filterCat('shopping',this)">🛍 Shopping</button>
      <button class="cat-tab" data-cat="attraction" onclick="filterCat('attraction',this)">📸 Attraction</button>
      <button class="cat-tab" data-cat="hotel"      onclick="filterCat('hotel',this)">🏨 Hotel</button>
    </div>
    <div id="list"></div>
    <div id="plot-bar">
      <button id="clear-btn" onclick="clearMap()">Clear</button>
      <button id="plot-btn" onclick="plotSelected()" disabled>Select places to plot</button>
    </div>
  </div>
</div>

<div id="geo-overlay"><div class="spin"></div><div id="geo-msg">Finding location…</div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ── State ──────────────────────────────────────────────
const CAT_COLOR={food:'#FF5722',shopping:'#9C27B0',attraction:'#2196F3',hotel:'#F9A825',other:'#607D8B'};
const CAT_LABEL={food:'🍜 Food',shopping:'🛍 Shopping',attraction:'📸 Attraction',hotel:'🏨 Hotel',other:'📍 Place'};
let allData={notes:{}}, currentNote='', currentCat='all';
let checked=new Set(), plotted={}, mallMarkers={};
let geoCache=JSON.parse(localStorage.getItem('gc2')||'{}');

// ── Map ────────────────────────────────────────────────
const map=L.map('map',{center:[31.218,121.462],zoom:13});
L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{
  subdomains:['0','1','2','3'],attribution:'© Google Maps',maxZoom:20
}).addTo(map);

// ── Load ───────────────────────────────────────────────
async function loadData(){
  try{ const r=await fetch('./data.json?t='+Date.now()); allData=await r.json(); }
  catch(e){ allData={notes:{}}; }
  const notes=Object.keys(allData.notes);
  const sel=document.getElementById('note-select');
  if(!notes.length){
    sel.innerHTML='<option>No notes yet</option>';
    showEmpty('No travel notes yet','Ask Claude to add places from your screenshots.');
    return;
  }
  sel.innerHTML=notes.map(n=>`<option value="${n}">${n}</option>`).join('');
  currentNote=notes[0]; sel.value=currentNote;
  renderList();
}

function switchNote(n){ currentNote=n; checked.clear(); clearMap(); renderList(); }

// ── Render list ────────────────────────────────────────
function renderList(){
  const note=allData.notes[currentNote];
  if(!note||!note.places||!note.places.length){
    showEmpty(`No places in "${currentNote}"`, 'Paste screenshots in the Claude chat and ask to add them here.');
    updateBtn(); return;
  }
  const streets=note.streets||{};
  const filtered=currentCat==='all'?note.places:note.places.filter(p=>p.category===currentCat);
  if(!filtered.length){
    showEmpty('No places in this category','Try a different filter.'); updateBtn(); return;
  }

  // Group by street (preserve order)
  const streetOrder=[...new Set(filtered.map(p=>p.street||'Other'))];
  const byStreet={};
  filtered.forEach(p=>{ const s=p.street||'Other'; (byStreet[s]=byStreet[s]||[]).push(p); });

  let html='';
  streetOrder.forEach(stName=>{
    const places=byStreet[stName];
    const meta=streets[stName]||{en:'',color:'#607D8B'};
    const c=meta.color;
    const ids=places.map(p=>p.id);
    const allOn=ids.every(id=>checked.has(id));

    html+=`<div class="st-section">
      <div class="st-hdr">
        <span class="st-pill" style="background:${c}">${stName}</span>
        <span class="st-en">${meta.en}</span>
        <button class="st-all" onclick="toggleAll(${JSON.stringify(ids)})">${allOn?'None':'All'}</button>
      </div>`;

    // Split into standalone + malls
    const malls={}, standalone=[];
    places.forEach(p=>{ if(p.mall)(malls[p.mall]=malls[p.mall]||[]).push(p); else standalone.push(p); });

    standalone.forEach(p=>{ html+=pCard(p,c); });

    Object.entries(malls).forEach(([mName,shops])=>{
      const mIds=shops.map(s=>s.id);
      const mAllOn=mIds.every(id=>checked.has(id));
      const mSel=mIds.filter(id=>checked.has(id)).length;
      html+=`<div class="mall-group open" id="mg_${esc(mName)}">
        <div class="mall-ghdr" onclick="toggleMallOpen('${mName}')">
          <div class="mall-gicon">🏬</div>
          <div style="flex:1;min-width:0">
            <div class="mall-gname">${mName}</div>
            <div class="mall-gct">${shops.length} places${mSel?' · '+mSel+' selected':''}</div>
          </div>
          <button class="mall-sel" onclick="event.stopPropagation();toggleAll(${JSON.stringify(mIds)})">${mAllOn?'None':'All'}</button>
          <span class="mall-chev">▼</span>
        </div>
        <div class="mall-items" id="mi_${esc(mName)}">
          ${shops.map(p=>pCard(p,c,true)).join('')}
        </div>
      </div>`;
    });

    html+='</div>';
  });

  document.getElementById('list').innerHTML=html;
  updateBtn();
}

function pCard(p,streetColor,isMall=false){
  const c=CAT_COLOR[p.category]||CAT_COLOR.other;
  const on=checked.has(p.id);
  return `<div class="pcard${isMall?' mitem':''}${on?' checked':''}" style="--c:${c}" onclick="toggle('${p.id}')">
    <div class="pcheck">${on?'✓':''}</div>
    <div class="pdot" style="background:${c}"></div>
    <div class="pinfo">
      <div class="pname">${p.name}${p.nameEn?` <span class="pname-en">${p.nameEn}</span>`:''}</div>
      <div class="pdesc">${p.description||''}</div>
    </div>
    <span class="pbadge" style="background:${c}">${(p.category||'').toUpperCase()}</span>
  </div>`;
}

function showEmpty(t,m){
  document.getElementById('list').innerHTML=`<div id="empty"><div class="ei">🗺️</div><h3>${t}</h3><p>${m}</p></div>`;
}

// ── Check logic ────────────────────────────────────────
function toggle(id){ checked.has(id)?checked.delete(id):checked.add(id); renderList(); }
function toggleAll(ids){
  const allOn=ids.every(id=>checked.has(id));
  ids.forEach(id=>allOn?checked.delete(id):checked.add(id));
  renderList();
}
function toggleMallOpen(name){
  const g=document.getElementById('mg_'+esc(name));
  const items=document.getElementById('mi_'+esc(name));
  g.classList.toggle('open');
  items.style.display=g.classList.contains('open')?'block':'none';
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.cat-tab').forEach(b=>{b.classList.remove('on');b.style.background='';});
  btn.classList.add('on');
  const cols={all:'#555',food:'#FF5722',shopping:'#9C27B0',attraction:'#2196F3',hotel:'#F9A825'};
  btn.style.background=cols[cat]||'#555';
  renderList();
}
function updateBtn(){
  const n=checked.size, btn=document.getElementById('plot-btn');
  btn.disabled=n===0;
  btn.textContent=n===0?'Select places to plot':`Plot ${n} place${n>1?'s':''} on Map →`;
}

// ── Plot ───────────────────────────────────────────────
async function plotSelected(){
  const note=allData.notes[currentNote];
  const places=(note?.places||[]).filter(p=>checked.has(p.id));
  if(!places.length)return;

  const needGeo=places.filter(p=>!p.lat||!p.lng);
  if(needGeo.length){
    document.getElementById('geo-overlay').classList.add('show');
    for(let i=0;i<needGeo.length;i++){
      const p=needGeo[i];
      document.getElementById('geo-msg').textContent=`Finding: ${p.name} (${i+1}/${needGeo.length})`;
      const c=await geocode(p.address||p.name);
      if(c){p.lat=c.lat;p.lng=c.lng;}
      await sleep(350);
    }
    document.getElementById('geo-overlay').classList.remove('show');
  }

  clearMap();
  const withCoords=places.filter(p=>p.lat&&p.lng);
  if(!withCoords.length){toast('Could not locate any selected places');return;}

  // Group by mall
  const malls={}, standalone=[];
  withCoords.forEach(p=>{ if(p.mall)(malls[p.mall]=malls[p.mall]||[]).push(p); else standalone.push(p); });

  standalone.forEach(p=>pin(p));
  Object.entries(malls).forEach(([name,shops])=>mallPin(name,shops));

  const pts=withCoords.map(p=>[p.lat,p.lng]);
  if(pts.length===1)map.setView(pts[0],16);
  else map.fitBounds(L.latLngBounds(pts).pad(.15));

  const skip=places.length-withCoords.length;
  toast(`Plotted ${withCoords.length} place${withCoords.length>1?'s':''}${skip?' ('+skip+' not found)':''} ✅`);
}

function pin(p){
  const c=CAT_COLOR[p.category]||CAT_COLOR.other;
  const url=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' Shanghai')}&center=${p.lat},${p.lng}`;
  const note=allData.notes[currentNote];
  const stColor=(note?.streets?.[p.street]?.color)||c;
  const m=L.marker([p.lat,p.lng],{
    icon:L.divIcon({className:'',
      html:`<div style="width:14px;height:14px;border-radius:50%;background:${stColor};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)"></div>`,
      iconSize:[14,14],iconAnchor:[7,7]}),zIndexOffset:100
  }).bindPopup(`
    <div class="pu-top" style="background:${stColor}"></div>
    <div class="pu-body">
      <div class="pu-cat" style="color:${stColor}">${p.street||''} · ${CAT_LABEL[p.category]||''}</div>
      <div class="pu-name">${p.name}${p.nameEn?`<br><span style="font-size:11px;color:#aaa;font-weight:400">${p.nameEn}</span>`:''}</div>
      <div class="pu-desc">${p.description||''}</div>
      <a class="pu-maps" href="${url}" target="_blank" style="background:${stColor}">Open in Google Maps →</a>
    </div>`,{maxWidth:260}).addTo(map);
  plotted[p.id]=m;
}

function mallPin(mallName,shops){
  const note=allData.notes[currentNote];
  const firstStreet=shops[0]?.street;
  const c=(note?.streets?.[firstStreet]?.color)||'#2E7D32';
  const avgLat=shops.reduce((s,p)=>s+p.lat,0)/shops.length;
  const avgLng=shops.reduce((s,p)=>s+p.lng,0)/shops.length;
  const icon=L.divIcon({className:'',
    html:`<div style="background:${c};color:#fff;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.3);border:2px solid #fff;transform:translate(-50%,-50%)">🏬 ${mallName} <span style="background:rgba(255,255,255,.25);border-radius:10px;padding:0 5px">${shops.length}</span></div>`,
    iconSize:[0,0],iconAnchor:[0,0]});
  const rows=shops.map(s=>{
    const sc=CAT_COLOR[s.category]||CAT_COLOR.other;
    const u=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name+' '+mallName+' Shanghai')}`;
    return `<div class="mall-pu-row">
      <strong style="color:${sc}">${s.name}${s.nameEn?' <span style="color:#aaa;font-weight:400">'+s.nameEn+'</span>':''}</strong>
      <span>${s.description||''}</span>
      <a href="${u}" target="_blank" style="font-size:10px;color:#007AFF;text-decoration:none">Maps →</a>
    </div>`;
  }).join('');
  const m=L.marker([avgLat,avgLng],{icon,zIndexOffset:200})
    .bindPopup(`
      <div class="pu-top" style="background:${c}"></div>
      <div class="pu-body">
        <div class="pu-cat" style="color:${c}">🏬 ${firstStreet||''}</div>
        <div class="pu-name">${mallName}</div>
        <div style="margin-top:6px">${rows}</div>
        <a class="pu-maps" style="background:${c};margin-top:8px" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mallName+' Shanghai')}" target="_blank">Open in Google Maps →</a>
      </div>`,{maxWidth:290}).addTo(map);
  mallMarkers[mallName]=m;
}

function clearMap(){
  Object.values(plotted).forEach(m=>map.removeLayer(m));
  Object.values(mallMarkers).forEach(m=>map.removeLayer(m));
  plotted={}; mallMarkers={};
}

// ── Geocode ────────────────────────────────────────────
async function geocode(q){
  if(geoCache[q])return geoCache[q];
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q+', Shanghai, China')}&format=json&limit=1`,
      {headers:{'Accept-Language':'en'}});
    const d=await r.json();
    if(d[0]){const c={lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};geoCache[q]=c;localStorage.setItem('gc2',JSON.stringify(geoCache));return c;}
  }catch(e){}
  return null;
}

// ── Utils ──────────────────────────────────────────────
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function esc(s){return CSS.escape(s);}
let tt;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),3500);}

loadData();
</script>
</body>
</html>
