<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>✈️ Travel Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--hdr:#0d0f14;
  --food:#FF5722;--shopping:#9C27B0;--attraction:#2196F3;
  --hotel:#F9A825;--mall:#2E7D32;--accent:#007AFF;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#app{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg)}
#app{display:flex;flex-direction:column}

/* Header */
header{
  background:var(--hdr);color:#fff;flex-shrink:0;
  padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top,10px));
  display:flex;align-items:center;gap:10px;
}
header h1{font-size:15px;font-weight:800;flex:1}
#note-select{
  background:rgba(255,255,255,.12);color:#fff;border:none;
  border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;
  font-family:-apple-system,sans-serif;cursor:pointer;max-width:160px;
}
#note-select option{color:#000;background:#fff}

/* Map */
#map{flex:0 0 48vh;min-height:160px}

/* Panel */
#panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}

/* Category filter tabs */
#cat-bar{
  display:flex;gap:6px;padding:8px 14px 4px;overflow-x:auto;
  flex-shrink:0;scrollbar-width:none;background:var(--bg);
}
#cat-bar::-webkit-scrollbar{display:none}
.cat-tab{
  padding:5px 13px;border-radius:20px;border:none;font-size:11px;
  font-weight:700;cursor:pointer;white-space:nowrap;
  background:#e5e5ea;color:#666;transition:all .15s;flex-shrink:0;
}
.cat-tab.on{color:#fff}

/* Place list */
#list{flex:1;overflow-y:auto;padding:4px 14px 80px}

/* Plot bar */
#plot-bar{
  position:absolute;bottom:0;left:0;right:0;
  padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom,10px));
  background:rgba(242,242,247,.95);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid #e0e0e0;display:flex;gap:8px;z-index:100;
}
#plot-btn{
  flex:1;background:var(--accent);color:#fff;border:none;
  padding:13px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;
}
#plot-btn:disabled{background:#c7c7cc;cursor:default}
#clear-btn{
  background:#e5e5ea;color:#333;border:none;
  padding:13px 16px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;
}

/* Place card */
.pcard{
  background:var(--card);border-radius:12px;margin-bottom:7px;
  box-shadow:0 1px 3px rgba(0,0,0,.07);
  display:flex;align-items:center;gap:10px;padding:11px 12px;
  cursor:pointer;user-select:none;transition:opacity .15s;
}
.pcard.dimmed{opacity:.4}
.pcheck{
  width:22px;height:22px;border-radius:6px;border:2px solid #d0d0d0;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:13px;transition:all .15s;
}
.pcard.checked .pcheck{border-color:var(--c);background:var(--c);color:#fff}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pname{font-size:13px;font-weight:700;color:#111;line-height:1.2}
.pname-en{font-size:11px;color:#aaa;font-weight:400}
.pdesc{font-size:11px;color:#999;margin-top:1px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pbadge{font-size:9px;font-weight:800;padding:2px 7px;
  border-radius:6px;color:#fff;text-transform:uppercase;flex-shrink:0}

/* Mall section header */
.mall-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 2px 4px;
}
.mall-label{font-size:11px;font-weight:800;color:var(--mall);text-transform:uppercase;letter-spacing:.3px}
.mall-line{flex:1;height:1px;background:#d0e8d0}

/* Empty state */
#empty{text-align:center;padding:40px 20px}
#empty .eicon{font-size:44px;margin-bottom:10px}
#empty h3{font-size:15px;font-weight:700;margin-bottom:6px;color:#333}
#empty p{font-size:13px;color:#999;line-height:1.5}

/* Popup */
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:0;overflow:hidden;border:none}
.leaflet-popup-content{margin:0!important}
.leaflet-popup-tip-container{display:none}
.leaflet-popup-close-button{top:6px!important;right:10px!important;font-size:18px!important;color:rgba(255,255,255,.9)!important;z-index:5}
.pu-top{height:5px}
.pu-body{padding:11px 13px 10px}
.pu-cat{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.pu-name{font-size:14px;font-weight:800;color:#111;margin-bottom:2px;line-height:1.2}
.pu-sub{font-size:11px;color:#aaa;margin-bottom:2px}
.pu-desc{font-size:11px;color:#555;line-height:1.4;margin-bottom:8px}
.pu-maps{display:block;text-align:center;padding:8px;border-radius:8px;font-size:12px;font-weight:700;color:#fff;text-decoration:none}

/* Toast */
#toast{
  position:fixed;bottom:85px;left:50%;transform:translateX(-50%);
  background:#333;color:#fff;padding:9px 16px;border-radius:20px;
  font-size:13px;font-weight:600;z-index:3000;
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1}

/* Loading spinner */
#geocode-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:2000;align-items:center;justify-content:center;flex-direction:column;gap:12px;
}
#geocode-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#geocode-msg{color:#fff;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>✈️ Travel Planner</h1>
    <select id="note-select" onchange="switchNote(this.value)">
      <option value="">Loading...</option>
    </select>
  </header>

  <div id="map"></div>

  <div id="panel" style="position:relative">
    <div id="cat-bar">
      <button class="cat-tab on" data-cat="all" style="background:#555" onclick="filterCat('all',this)">All</button>
      <button class="cat-tab" data-cat="food"       onclick="filterCat('food',this)">🍜 Food</button>
      <button class="cat-tab" data-cat="shopping"   onclick="filterCat('shopping',this)">🛍 Shopping</button>
      <button class="cat-tab" data-cat="attraction" onclick="filterCat('attraction',this)">📸 Attraction</button>
      <button class="cat-tab" data-cat="hotel"      onclick="filterCat('hotel',this)">🏨 Hotel</button>
    </div>

    <div id="list"></div>

    <div id="plot-bar">
      <button id="clear-btn" onclick="clearMap()">Clear Map</button>
      <button id="plot-btn" onclick="plotSelected()" disabled>Select places to plot</button>
    </div>
  </div>
</div>

<div id="geocode-overlay">
  <div class="spinner"></div>
  <div id="geocode-msg">Finding locations...</div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
const CAT_COLOR = {food:'#FF5722',shopping:'#9C27B0',attraction:'#2196F3',hotel:'#F9A825',other:'#607D8B'};
const CAT_LABEL = {food:'🍜 Food',shopping:'🛍 Shopping',attraction:'📸 Attraction',hotel:'🏨 Hotel',other:'📍 Place'};

let allData = { notes: {} };
let currentNote = '';
let currentCat = 'all';
let checked = new Set();
let plotted = {};
let mallMarkers = {};
let geocodeCache = JSON.parse(localStorage.getItem('geo_cache') || '{}');

// ═══════════════════════════════════════════════
// MAP
// ═══════════════════════════════════════════════
const map = L.map('map', { center:[31.218,121.462], zoom:13, zoomControl:true });
L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
  subdomains:['0','1','2','3'],
  attribution:'© Google Maps',
  maxZoom:20
}).addTo(map);

// ═══════════════════════════════════════════════
// LOAD DATA
// ═══════════════════════════════════════════════
async function loadData() {
  try {
    const r = await fetch('./data.json?t=' + Date.now());
    allData = await r.json();
  } catch(e) {
    allData = { notes:{} };
  }

  const notes = Object.keys(allData.notes);
  const sel = document.getElementById('note-select');

  if (!notes.length) {
    sel.innerHTML = '<option value="">No notes yet</option>';
    renderEmpty('No travel notes yet', 'Ask Claude to add places from your screenshots — they\'ll appear here organised by trip.');
    return;
  }

  sel.innerHTML = notes.map(n => `<option value="${n}">${n}</option>`).join('');
  currentNote = notes[0];
  sel.value = currentNote;
  renderList();
}

function switchNote(note) {
  currentNote = note;
  checked.clear();
  clearMap();
  renderList();
}

// ═══════════════════════════════════════════════
// RENDER LIST
// ═══════════════════════════════════════════════
function renderList() {
  const list = document.getElementById('list');
  const places = (allData.notes[currentNote]?.places || []);
  const filtered = currentCat === 'all' ? places : places.filter(p => p.category === currentCat);

  if (!places.length) {
    renderEmpty(`No places in "${currentNote}"`, 'Paste screenshots in the Claude chat and ask to add them to this note.');
    updatePlotBtn();
    return;
  }
  if (!filtered.length) {
    renderEmpty('No places in this category', 'Try selecting a different filter above.');
    updatePlotBtn();
    return;
  }

  // Group by mall
  const malls = {};
  const standalone = [];
  filtered.forEach(p => {
    if (p.mall) { (malls[p.mall] = malls[p.mall]||[]).push(p); }
    else standalone.push(p);
  });

  let html = '';

  // Mall groups
  Object.entries(malls).forEach(([mallName, shops]) => {
    html += `<div class="mall-header">
      <span class="mall-label">🏬 ${mallName}</span>
      <div class="mall-line"></div>
    </div>`;
    shops.forEach(p => { html += placeCard(p); });
  });

  // Standalone
  if (standalone.length) {
    if (Object.keys(malls).length) {
      html += `<div class="mall-header"><span class="mall-label">Other Places</span><div class="mall-line"></div></div>`;
    }
    standalone.forEach(p => { html += placeCard(p); });
  }

  list.innerHTML = html;
  updatePlotBtn();
}

function placeCard(p) {
  const c = CAT_COLOR[p.category] || CAT_COLOR.other;
  const isChecked = checked.has(p.id);
  return `<div class="pcard ${isChecked?'checked':''}" style="--c:${c}" onclick="toggleCheck('${p.id}')">
    <div class="pcheck">${isChecked ? '✓' : ''}</div>
    <div class="pdot" style="background:${c}"></div>
    <div class="pinfo">
      <div class="pname">${p.name}${p.nameEn?` <span class="pname-en">${p.nameEn}</span>`:''}</div>
      <div class="pdesc">${p.description || p.address || ''}</div>
    </div>
    <span class="pbadge" style="background:${c}">${(p.category||'other').toUpperCase()}</span>
  </div>`;
}

function renderEmpty(title, msg) {
  document.getElementById('list').innerHTML = `<div id="empty">
    <div class="eicon">🗺️</div>
    <h3>${title}</h3>
    <p>${msg}</p>
  </div>`;
}

// ═══════════════════════════════════════════════
// CHECK / FILTER
// ═══════════════════════════════════════════════
function toggleCheck(id) {
  if (checked.has(id)) checked.delete(id);
  else checked.add(id);
  renderList();
}

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(b => {
    b.classList.remove('on');
    b.style.background = '';
  });
  btn.classList.add('on');
  const colors = {all:'#555',food:'#FF5722',shopping:'#9C27B0',attraction:'#2196F3',hotel:'#F9A825'};
  btn.style.background = colors[cat] || '#555';
  renderList();
}

function updatePlotBtn() {
  const btn = document.getElementById('plot-btn');
  const n = checked.size;
  if (n === 0) { btn.disabled = true; btn.textContent = 'Select places to plot'; }
  else { btn.disabled = false; btn.textContent = `Plot ${n} place${n>1?'s':''} on Map →`; }
}

// ═══════════════════════════════════════════════
// PLOT
// ═══════════════════════════════════════════════
async function plotSelected() {
  const places = (allData.notes[currentNote]?.places || [])
    .filter(p => checked.has(p.id));
  if (!places.length) return;

  // Geocode any missing coords
  const needGeo = places.filter(p => !p.lat || !p.lng);
  if (needGeo.length) {
    document.getElementById('geocode-overlay').classList.add('show');
    for (let i = 0; i < needGeo.length; i++) {
      const p = needGeo[i];
      document.getElementById('geocode-msg').textContent =
        `Finding: ${p.name} (${i+1}/${needGeo.length})`;
      const coords = await geocode(p.address || p.name);
      if (coords) { p.lat = coords.lat; p.lng = coords.lng; }
      await sleep(350);
    }
    document.getElementById('geocode-overlay').classList.remove('show');
  }

  // Plot
  const withCoords = places.filter(p => p.lat && p.lng);
  if (!withCoords.length) { toast('Could not find locations for selected places'); return; }

  clearMap();

  // Group by mall
  const malls = {};
  const standalone = [];
  withCoords.forEach(p => {
    if (p.mall) { (malls[p.mall]=malls[p.mall]||[]).push(p); }
    else standalone.push(p);
  });

  standalone.forEach(p => plotPin(p));
  Object.entries(malls).forEach(([name,shops]) => plotMall(name, shops));

  // Fit bounds
  const pts = withCoords.map(p => [p.lat, p.lng]);
  if (pts.length === 1) map.setView(pts[0], 16);
  else map.fitBounds(L.latLngBounds(pts).pad(.15));

  const skipped = places.length - withCoords.length;
  toast(`Plotted ${withCoords.length} place${withCoords.length>1?'s':''}${skipped?` (${skipped} not found)`:''}  ✅`);
}

function plotPin(p) {
  const c = CAT_COLOR[p.category] || CAT_COLOR.other;
  const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' '+(p.address||''))}&center=${p.lat},${p.lng}`;
  const m = L.marker([p.lat,p.lng], {
    icon: L.divIcon({className:'',
      html:`<div style="width:14px;height:14px;border-radius:50%;background:${c};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)"></div>`,
      iconSize:[14,14],iconAnchor:[7,7]}),zIndexOffset:100
  }).bindPopup(`
    <div class="pu-top" style="background:${c}"></div>
    <div class="pu-body">
      <div class="pu-cat" style="color:${c}">${CAT_LABEL[p.category]||'📍'}</div>
      <div class="pu-name">${p.name}${p.nameEn?`<br><span style="font-size:11px;color:#aaa;font-weight:400">${p.nameEn}</span>`:''}</div>
      <div class="pu-sub">📍 ${p.address||p.street||''}</div>
      ${p.description?`<div class="pu-desc">${p.description}</div>`:''}
      <a class="pu-maps" href="${url}" target="_blank" style="background:${c}">Open in Google Maps →</a>
    </div>`,{maxWidth:260}).addTo(map);
  plotted[p.id] = m;
}

function plotMall(mallName, shops) {
  const avgLat = shops.reduce((s,p)=>s+p.lat,0)/shops.length;
  const avgLng = shops.reduce((s,p)=>s+p.lng,0)/shops.length;
  const icon = L.divIcon({className:'',
    html:`<div style="background:#2E7D32;color:#fff;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.3);border:2px solid #fff;transform:translate(-50%,-50%)">🏬 ${mallName} <span style="background:rgba(255,255,255,.3);border-radius:10px;padding:0 5px">${shops.length}</span></div>`,
    iconSize:[0,0],iconAnchor:[0,0]});
  const rows = shops.map(s=>{
    const c=CAT_COLOR[s.category]||'#607D8B';
    const url=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name+' '+mallName)}`;
    return `<div style="padding:5px 0;border-top:1px solid #f0f0f0">
      <div style="font-size:12px;font-weight:700;color:${c}">${s.name}</div>
      ${s.description?`<div style="font-size:11px;color:#999">${s.description}</div>`:''}
      <a href="${url}" target="_blank" style="font-size:10px;color:#007AFF;text-decoration:none">Maps →</a>
    </div>`;
  }).join('');
  const m = L.marker([avgLat,avgLng],{icon,zIndexOffset:200})
    .bindPopup(`
      <div class="pu-top" style="background:#2E7D32"></div>
      <div class="pu-body">
        <div class="pu-cat" style="color:#2E7D32">🏬 MALL / COMPLEX</div>
        <div class="pu-name">${mallName}</div>
        <div style="margin-top:6px">${rows}</div>
        <a class="pu-maps" style="background:#2E7D32;margin-top:8px" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mallName)}" target="_blank">Open Mall in Maps →</a>
      </div>`,{maxWidth:280}).addTo(map);
  mallMarkers[mallName] = m;
}

function clearMap() {
  Object.values(plotted).forEach(m=>map.removeLayer(m));
  Object.values(mallMarkers).forEach(m=>map.removeLayer(m));
  plotted = {}; mallMarkers = {};
}

// ═══════════════════════════════════════════════
// GEOCODE
// ═══════════════════════════════════════════════
async function geocode(query) {
  if (geocodeCache[query]) return geocodeCache[query];
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query+', China')}&format=json&limit=1`,
      { headers:{'Accept-Language':'en'} }
    );
    const d = await r.json();
    if (d[0]) {
      const coords = { lat:parseFloat(d[0].lat), lng:parseFloat(d[0].lon) };
      geocodeCache[query] = coords;
      localStorage.setItem('geo_cache', JSON.stringify(geocodeCache));
      return coords;
    }
  } catch(e) {}
  return null;
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

let toastT;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),3500);
}

// ── Init ──
loadData();
</script>
</body>
</html>
