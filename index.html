<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>上海逛街地图</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#root{display:flex;flex-direction:column}

header{
  background:#0d0f14;color:#fff;flex-shrink:0;
  padding:10px 14px 9px;
  padding-top:max(10px,env(safe-area-inset-top,10px));
}
header h1{font-size:15px;font-weight:800}
header p{font-size:11px;color:#555;margin-top:2px}

#bar{
  background:#12141d;padding:7px 10px;
  display:flex;gap:6px;overflow-x:auto;
  flex-shrink:0;scrollbar-width:none;
}
#bar::-webkit-scrollbar{display:none}
.btn{
  padding:6px 15px;border-radius:20px;border:none;
  font-size:11px;font-weight:700;cursor:pointer;
  white-space:nowrap;opacity:.38;transition:opacity .2s;
}
.btn.on{opacity:1}

#map{flex:1}

/* Popup */
.leaflet-popup-content-wrapper{
  border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);
  padding:0;overflow:hidden;border:none;
}
.leaflet-popup-content{margin:0!important}
.leaflet-popup-tip-container{display:none}
.leaflet-popup-close-button{
  top:6px!important;right:10px!important;
  font-size:20px!important;color:rgba(255,255,255,.9)!important;z-index:10;
}
.pu-top{height:5px}
.pu-body{padding:13px 15px 12px}
.pu-label{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.pu-name{font-size:16px;font-weight:800;color:#111;margin-bottom:3px;line-height:1.2}
.pu-addr{font-size:11px;color:#aaa;margin-bottom:7px}
.pu-desc{font-size:12px;color:#555;line-height:1.55;margin-bottom:10px}
.pu-btn{
  display:block;text-align:center;color:#fff;padding:10px;
  border-radius:10px;font-size:13px;font-weight:700;text-decoration:none;
}

/* Legend */
.leg{
  background:rgba(255,255,255,.97);padding:9px 12px;
  border-radius:10px;box-shadow:0 3px 14px rgba(0,0,0,.14);
  max-width:160px;
}
.leg-sec{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.leg-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#444;margin:3px 0}
.leg-bar{width:20px;height:4px;border-radius:2px;flex-shrink:0}
.leg-hr{height:1px;background:#eee;margin:5px 0}
.leg-hotel{width:14px;height:14px;background:#FFD600;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px}
</style>
</head>
<body>
<div id="root">
  <header>
    <h1>🗺 上海逛街地图 Shanghai Citywalk</h1>
    <p>27 shops · 8 streets · 🏨 your hotel · tap pins for details</p>
  </header>
  <div id="bar">
    <button class="btn on" id="b-all" style="background:#555;color:#fff"    onclick="flt('all')">All</button>
    <button class="btn on" id="b-r1"  style="background:#9C27B0;color:#fff" onclick="flt('r1')">淮海→思南→新天地</button>
    <button class="btn on" id="b-r2"  style="background:#F4511E;color:#fff" onclick="flt('r2')">巨富长 Streetwear</button>
  </div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

// ── Map ───────────────────────────────────────────────────
// Zoom out a bit to show hotel (3km north) + all shops
const map = L.map('map', { center:[31.233, 121.455], zoom:13, zoomControl:true });

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// ── Hotel marker ──────────────────────────────────────────
const hotelLat = 31.2480, hotelLng = 121.4530;

const hotelIcon = L.divIcon({
  className: '',
  html: `<div style="
    background:#FFD600;color:#000;
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.35);
    border:2.5px solid #fff;
    cursor:pointer;
  ">🏨</div>`,
  iconSize: [36,36], iconAnchor: [18,18]
});

L.marker([hotelLat, hotelLng], { icon: hotelIcon, zIndexOffset: 500 })
  .bindPopup(`
    <div class="pu-top" style="background:#FFD600"></div>
    <div class="pu-body">
      <div class="pu-label" style="color:#996600">YOUR HOTEL</div>
      <div class="pu-name">唯庭世纪酒店</div>
      <div class="pu-addr">📍 上海静安火车站南广场店</div>
      <div class="pu-desc">~3km north of 巨富长 district.<br>Metro Line 1 connects you directly to all the shop areas.</div>
      <a class="pu-btn" href="https://www.google.com/maps/search/?api=1&query=唯庭世纪酒店+上海静安火车站南广场&center=${hotelLat},${hotelLng}" target="_blank" style="background:#FFD600;color:#000">Open in Google Maps →</a>
    </div>`, { maxWidth: 270 }
  ).addTo(map);

// Hotel label
L.marker([hotelLat, hotelLng], {
  icon: L.divIcon({
    className: '',
    html: `<span style="display:inline-block;transform:translate(-50%, 12px);background:#FFD600;color:#000;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800;white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.2);font-family:-apple-system,sans-serif">唯庭世纪酒店</span>`,
    iconSize:[0,0], iconAnchor:[0,0]
  }), interactive: false, zIndexOffset: 400
}).addTo(map);

// ── Route data ────────────────────────────────────────────
const DATA = [
  { id:'r1', streets:[
    { n:'淮海中路', en:'Huaihai Middle Road', c:'#AB47BC',
      path:[[31.2173,121.4500],[31.2171,121.4545],[31.2170,121.4584],[31.2169,121.4620],[31.2168,121.4645],[31.2166,121.4695]],
      shops:[
        {n:'Masonprince', a:'淮海中路',      d:'漩涡泳池、戴VR的仿真人',   lat:31.2172, lng:121.4543},
        {n:'Housnowhere', a:'淮海中路',      d:'巨人展、巨型米奇、银色F1', lat:31.2174, lng:121.4580},
        {n:'Matcha Wang', a:'淮海中路',      d:'刷屏ins的抹茶特调',        lat:31.2170, lng:121.4612},
        {n:'Hai550',      a:'淮海中路 755号',d:'7层楼的小众设计师集合店',  lat:31.21893,lng:121.46459},
      ]
    },
    { n:'思南路', en:'Sinan Road', c:'#7B1FA2',
      path:[[31.2222,121.4668],[31.2205,121.4665],[31.2188,121.4663],[31.2170,121.4668],[31.2150,121.4672],[31.2130,121.4675]],
      shops:[
        {n:'周公馆',  a:'思南路 73号',    d:'周恩来旧居，免门票不需预约',  lat:31.2197, lng:121.4663},
        {n:'小嬛嬛',  a:'思南公馆商圈',  d:'人均100+地道宁波菜',           lat:31.2186, lng:121.4671},
        {n:'思南公馆',a:'思南路 30号',   d:'51栋花园洋房、露天博物馆',     lat:31.21884,lng:121.46609},
        {n:'古董花园',a:'思南路 44号',   d:'10多年老店，《繁花》取景地',   lat:31.21660,lng:121.46695},
        {n:'思南书局',a:'复兴中路 517号',d:'4层空间，建筑本身很有味道',    lat:31.21538,lng:121.46921},
      ]
    },
    { n:'新天地', en:'Xintiandi', c:'#3949AB',
      path:[[31.2208,121.4700],[31.2200,121.4722],[31.2192,121.4745],[31.2180,121.4762],[31.2166,121.4762],[31.2155,121.4758]],
      shops:[
        {n:'KWL',                  a:'新天地',d:'2000平韩系服装',               lat:31.21935,lng:121.47498},
        {n:'伦敦小狗面包',         a:'新天地',d:'高颜值面包',                   lat:31.21920,lng:121.47470},
        {n:'纽约贝果博物馆',       a:'新天地',d:'新天地老网红',                 lat:31.21905,lng:121.47515},
        {n:'Piggyoo 人生四格漫画', a:'新天地',d:'弘大同款漫画专门店',           lat:31.21672,lng:121.47488},
        {n:'三夏社',               a:'新天地',d:'追星女孩必逛',                 lat:31.21660,lng:121.47510},
        {n:'Looknow Lab',          a:'新天地',d:'超多Jellycat',                 lat:31.21648,lng:121.47532},
        {n:'HARMAY 话梅',          a:'新天地',d:'各种大牌护肤品化妆品旅行装',   lat:31.21636,lng:121.47500},
      ]
    },
  ]},
  { id:'r2', streets:[
    { n:'富民路', en:'Fumin Road', c:'#EF6C00',
      path:[[31.2228,121.4514],[31.2205,121.4515],[31.21830,121.45177],[31.21737,121.45235],[31.2155,121.4525],[31.2128,121.4530]],
      shops:[
        {n:'Cosmos Retro Flower & Vintage',a:'富民路 247号',      d:'复古花卉古着',           lat:31.21830,lng:121.45177},
        {n:'Supreme',                      a:'富民路 291号',      d:'Supreme旗舰店',          lat:31.21737,lng:121.45235},
        {n:'Times Remake',                 a:'富民路 291号 104室',d:'潮流古着，与Supreme同楼',lat:31.21748,lng:121.45255},
      ]
    },
    { n:'延庆路', en:'Yanqing Road', c:'#E65100',
      path:[[31.2157,121.4494],[31.2155,121.4510],[31.21537,121.45153],[31.21542,121.4524],[31.2151,121.4562]],
      shops:[
        {n:'MondaySleepingClub',a:'延庆路 72号',d:'潮流概念店',  lat:31.21537,lng:121.45153},
        {n:'Goodbai',           a:'延庆路 92号',d:'特色精品品牌',lat:31.21542,lng:121.45240},
      ]
    },
    { n:'襄阳北路', en:'Xiangyang North Rd', c:'#D32F2F',
      path:[[31.2224,121.4550],[31.2200,121.4551],[31.2188,121.4552],[31.2165,121.4554],[31.2138,121.4557]],
      shops:[{n:'巨浪',a:'襄阳北路 66弄 2号',d:'小众潮牌',lat:31.21897,lng:121.4553}]
    },
    { n:'巨鹿路', en:'Julu Road', c:'#C62828',
      path:[[31.2193,121.4430],[31.2192,121.4462],[31.21911,121.44943],[31.21920,121.4510],[31.2192,121.4558],[31.2192,121.4600]],
      shops:[
        {n:'Juice',          a:'巨鹿路 832号',d:'CLOT联名 & 限定发售',lat:31.21911,lng:121.44943},
        {n:'LABELHOOD HOUSE',a:'巨鹿路 796号',d:'多品牌潮流概念旗舰', lat:31.21922,lng:121.4510},
      ]
    },
    { n:'长乐路', en:'Changle Road', c:'#AD1457',
      path:[[31.2162,121.4478],[31.21682,121.45079],[31.21740,121.45175],[31.21791,121.45274],[31.21815,121.4558],[31.21830,121.4590]],
      shops:[
        {n:'fRUITYSHOP',    a:'长乐路 617号',       d:'特色概念时装店',            lat:31.21682,lng:121.45079},
        {n:'fly streetwear',a:'长乐路 704号',       d:'滑板 & 街头时尚',           lat:31.21791,lng:121.45274},
        {n:'Trophy Market', a:'长乐路 774弄 1-22号',d:'复古集市 / 多品牌概念空间', lat:31.21815,lng:121.4558},
      ]
    },
  ]},
];

// ── Build layers ──────────────────────────────────────────
const layers = {};

DATA.forEach(route => {
  layers[route.id] = L.layerGroup().addTo(map);
  const g = layers[route.id];

  route.streets.forEach(st => {
    L.polyline(st.path,{color:st.c,weight:14,opacity:.18,lineCap:'round',lineJoin:'round'}).addTo(g);
    L.polyline(st.path,{color:st.c,weight:6, opacity:.90,lineCap:'round',lineJoin:'round'}).addTo(g);

    const mid = st.path[Math.floor(st.path.length/2)];
    L.marker(mid,{
      icon:L.divIcon({
        className:'',
        html:`<span style="display:inline-block;transform:translate(-50%,-50%);background:${st.c};color:#fff;padding:2px 10px;border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap;pointer-events:none;box-shadow:0 1px 5px rgba(0,0,0,.25);font-family:-apple-system,sans-serif">${st.n}</span>`,
        iconSize:[0,0],iconAnchor:[0,0]
      }),interactive:false,zIndexOffset:-200
    }).addTo(g);

    st.shops.forEach(s => {
      const url=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.n+' '+s.a+' 上海')}&center=${s.lat},${s.lng}`;
      L.marker([s.lat,s.lng],{
        icon:L.divIcon({
          className:'',
          html:`<div style="width:14px;height:14px;border-radius:50%;background:${st.c};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer"></div>`,
          iconSize:[14,14],iconAnchor:[7,7]
        }),zIndexOffset:100
      }).bindPopup(`
        <div class="pu-top" style="background:${st.c}"></div>
        <div class="pu-body">
          <div class="pu-label" style="color:${st.c}">${st.n} · ${st.en}</div>
          <div class="pu-name">${s.n}</div>
          <div class="pu-addr">📍 ${s.a}</div>
          <div class="pu-desc">${s.d}</div>
          <a class="pu-btn" href="${url}" target="_blank" style="background:${st.c}">Open in Google Maps →</a>
        </div>`,{maxWidth:270}).addTo(g);
    });
  });
});

// ── Legend ────────────────────────────────────────────────
const LegCtrl = L.Control.extend({
  options:{position:'bottomright'},
  onAdd(){
    const d=L.DomUtil.create('div','leg');
    d.innerHTML=`<div class="leg-row"><div class="leg-hotel">🏨</div><b>Your hotel</b></div><div class="leg-hr"></div>`;
    DATA.forEach((route,i)=>{
      if(i) d.innerHTML+='<div class="leg-hr"></div>';
      const label=route.id==='r1'?'淮海→思南→新天地':'巨富长 Streetwear';
      const color=route.id==='r1'?'#9C27B0':'#F4511E';
      d.innerHTML+=`<div class="leg-sec" style="color:${color}">${label}</div>`;
      route.streets.forEach(s=>{
        d.innerHTML+=`<div class="leg-row"><div class="leg-bar" style="background:${s.c}"></div>${s.n}</div>`;
      });
    });
    return d;
  }
});
new LegCtrl().addTo(map);

// ── Filter ────────────────────────────────────────────────
const active=new Set(['r1','r2']);
function flt(id){
  if(id==='all'){active.add('r1');active.add('r2');}
  else if(active.has(id)&&active.size>1)active.delete(id);
  else active.add(id);
  ['r1','r2'].forEach(rid=>{
    active.has(rid)?(!map.hasLayer(layers[rid])&&layers[rid].addTo(map)):(map.hasLayer(layers[rid])&&map.removeLayer(layers[rid]));
    document.getElementById('b-'+rid).classList.toggle('on',active.has(rid));
  });
  document.getElementById('b-all').classList.toggle('on',active.size===2);
}
</script>
</body>
</html>
